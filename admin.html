<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ThikThak Order Admin</title><style>body{font-family:system-ui,Arial;background:#f6f6f6;margin:0;color:#222}.wrap{max-width:1100px;margin:auto;padding:20px}h1{color:#a71916}.panel{background:#fff;border-radius:12px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #0001}input,button,select{font:inherit;padding:10px;border:1px solid #ccc;border-radius:8px;margin:4px}button{background:#a71916;color:white;border:0;cursor:pointer}.orders{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}td,th{padding:9px;border-bottom:1px solid #eee;text-align:left;font-size:14px}th{background:#fff1e9}.muted{color:#666;font-size:13px}</style></head><body><div class="wrap"><h1>ThikThak — অর্ডার ম্যানেজমেন্ট</h1><div class="panel"><label>Apps Script Web App URL <input id="url" style="width:min(560px,90%)" placeholder="https://script.google.com/macros/s/.../exec"></label><br><label>Admin Key <input id="key" type="password" placeholder="আপনার গোপন ADMIN_KEY"></label><button onclick="loadOrders()">অর্ডার দেখুন / Refresh</button><p class="muted">URL ও key এই ডিভাইসের এই পেজে স্থায়ীভাবে সংরক্ষণ করা হয় না। Admin key কাউকে দেবেন না।</p></div><div class="panel"><b id="summary">অর্ডার লোড করা হয়নি</b><div class="orders"><table><thead><tr><th>আইডি / সময়</th><th>কাস্টমার</th><th>পণ্য</th><th>ঠিকানা</th><th>বিল</th><th>স্ট্যাটাস</th><th>আপডেট</th></tr></thead><tbody id="rows"></tbody></table></div></div></div><script>
async function loadOrders(){const u=document.getElementById('url').value.trim(),k=document.getElementById('key').value;if(!u||!k){alert('URL ও Admin Key দিন');return}try{const r=await fetch(u+'?action=list&key='+encodeURIComponent(k));const d=await r.json();if(!d.ok)throw Error(d.error||'Could not load');document.getElementById('summary').textContent='মোট অর্ডার: '+d.orders.length;const tb=document.getElementById('rows');tb.innerHTML='';for(const o of d.orders){const tr=document.createElement('tr');const vals=[o.orderId+'\n'+o.createdAt,o.name+'\n'+o.phone,o.color+' / '+o.size+'\nপরিমাণ: '+o.qty,o.address+'\n'+o.area,'৳'+o.grandTotal];for(const v of vals){const td=document.createElement('td');td.textContent=v;tr.appendChild(td)}const statusTd=document.createElement('td'),sel=document.createElement('select');['নতুন','নিশ্চিত','প্রসেসিং','ডেলিভারিতে','সম্পন্ন','বাতিল'].forEach(s=>{const op=document.createElement('option');op.value=s;op.textContent=s;if(s===o.status)op.selected=true;sel.appendChild(op)});statusTd.appendChild(sel);tr.appendChild(statusTd);const act=document.createElement('td'),b=document.createElement('button');b.textContent='Save';b.onclick=()=>updateStatus(o.orderId,sel.value);act.appendChild(b);tr.appendChild(act);tb.appendChild(tr)}}catch(e){alert('অর্ডার লোড হয়নি: '+e.message+'\nApps Script URL, deployment access ও Admin Key যাচাই করুন।')}}
async function updateStatus(id,status){const u=document.getElementById('url').value.trim(),key=document.getElementById('key').value;try{const r=await fetch(u,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'update',key,orderId:id,status})});const d=await r.json();if(!d.ok)throw Error(d.error||'Update failed');alert('স্ট্যাটাস আপডেট হয়েছে');loadOrders()}catch(e){alert('আপডেট হয়নি: '+e.message)}}
</script></body></html>
